<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FabiNator · Faculdade Donaduzzi</title>
<link rel="stylesheet" href="styles.css" />
<style>
  #root, .stage { min-height: 100vh; }
  .content { position: relative; z-index: 5; flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 4px clamp(16px,4vw,48px) 16px; }

  /* ---------- HOME ---------- */
  .screen-home { width: 100%; max-width: 1240px; display: flex; align-items: flex-start; justify-content: center; gap: 24px; }
  .home-side { position: absolute; left: clamp(12px,3vw,40px); top: 8px; z-index: 6; }
  .home-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .home-row { display: flex; align-items: center; justify-content: center; gap: clamp(12px,2vw,30px); width: 100%; margin: -10px 0; }
  .home-row .bubble { flex: 0 1 320px; align-self: center; }

  /* ---------- GAME / GUESS / RESULT shared two-column ---------- */
  .screen-game, .screen-guess, .screen-result {
    width: 100%; max-width: 1180px; display: flex; align-items: center; justify-content: center; gap: clamp(20px,4vw,70px); }
  .game-fabi { flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: center; }
  .fabi-home { height: min(60vh, 560px); }
  .fabi-game { height: min(60vh, 540px); }
  .games-pill { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(#FCF6EA,#EBD9B6);
    color:var(--wine-800); font-family:'Poppins'; font-weight:600; font-size:14px; padding:10px 18px;
    border-radius:999px; border:1.5px solid rgba(169,116,26,.45); box-shadow:var(--shadow-md); }
  .games-pill:hover { filter:brightness(1.03); }
  .game-main, .guess-main, .result-main { flex: 1 1 560px; display: flex; flex-direction: column; align-items: center; max-width: 620px; }
  .game-foot { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 560px; margin-top: 20px; gap: 16px; }

  @media (max-width: 880px) {
    .content { align-items: flex-start; }
    .home-side { position: static; margin: 0 auto 6px; max-width: 320px; }
    .screen-home { flex-direction: column; }
    .home-row { flex-direction: column; }
    .home-row .bubble { flex: 0 0 auto; max-width: 340px; }
    .screen-game, .screen-guess, .screen-result { flex-direction: column; gap: 6px; }
    .fabi-home { height: min(44vh, 380px); }
    .fabi-game { height: min(34vh, 300px); }
    .game-main, .guess-main, .result-main { flex: 0 0 auto; width: 100%; }
    .topbar .wordmark { display: none; }
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#5C1626" />
    <circle cx="50" cy="46" r="24" fill="#E0A92E" />
    <text x="50" y="56" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#5C1626" text-anchor="middle">F</text>
  </svg>
</template>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="data.js"></script>

</body>
</html>
