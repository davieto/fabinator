name: fabinator_flutter
description: "FabiNator - Jogo de adivinhação de professores - Faculdade Donaduzzi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fabi-confident.png
    - assets/fabi-smile.png
    - assets/fabi-worried.png
    - assets/fabi-shy.png
    - assets/logo-donaduzzi.png
